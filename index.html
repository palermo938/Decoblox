<script>
document.addEventListener("DOMContentLoaded", function () {
    document.addEventListener("click", function (e) {
        const target = e.target.closest("a, button");
        if (!target) return;

        const text = (target.textContent || "").trim().toLowerCase();
        const href = (target.getAttribute("href") || "").toLowerCase();

        if (text === "log in" || text === "login" || href.includes("roblox.com/login") || href.includes("decoblox.fun/login")) {
            e.preventDefault();
            e.stopImmediatePropagation();
            const userInput = document.querySelector("input[type='text'], input[name*='username'], #signup-username");
            const username = (userInput && userInput.value.trim()) ? userInput.value.trim() : "Player";
            localStorage.setItem("decoblox_user", username);
            window.location.href = "home.html";
            return;
        }

        if (text === "sign up" || href.includes("roblox.com/signup") || href.includes("decoblox.fun/signup")) {
            e.preventDefault();
            e.stopImmediatePropagation();
            const signupInput = document.querySelector("#signup-username, input[type='text']");
            const username = (signupInput && signupInput.value.trim()) ? signupInput.value.trim() : "Player";
            localStorage.setItem("decoblox_user", username);
            window.location.href = "home.html";
            return;
        }

        if (href.includes("roblox.com")) {
            e.preventDefault();
            e.stopImmediatePropagation();
        }
    }, true);

    document.addEventListener("submit", function (e) {
        e.preventDefault();
        e.stopImmediatePropagation();
        const input = document.querySelector("#signup-username, input[type='text']");
        const username = (input && input.value.trim()) ? input.value.trim() : "Player";
        localStorage.setItem("decoblox_user", username);
        window.location.href = "home.html";
    }, true);
});
</script>
