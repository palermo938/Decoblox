<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decoblox</title>
    <link rel="icon" href="logo.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "HCo Gotham SSm", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #191b1d;
            background-image: linear-gradient(rgba(25, 27, 29, 0.78), rgba(25, 27, 29, 0.88)),
                              radial-gradient(circle at top, #2c3137 0%, #191b1d 70%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
        }

        .nav-logo img {
            height: 36px;
            width: auto;
            display: block;
            filter: brightness(0) invert(1);
        }

        .btn-top-login {
            background-color: #ffffff;
            color: #191b1d;
            border: none;
            border-radius: 8px;
            padding: 9px 22px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.15s;
        }

        .btn-top-login:hover {
            background-color: #e3e5e8;
        }

        /* Main Center Container */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .center-logo {
            margin-bottom: 24px;
            text-align: center;
        }

        .center-logo img {
            height: 54px;
            width: auto;
            filter: brightness(0) invert(1);
        }

        /* Auth Box (2020 Dark Card Style) */
        .auth-card {
            background-color: #232527;
            border-radius: 8px;
            width: 100%;
            max-width: 420px;
            padding: 28px 28px 32px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        }

        .auth-card h2 {
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 22px;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #bdbebe;
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            background-color: #191b1d;
            border: 1px solid #393b3d;
            border-radius: 6px;
            padding: 11px 12px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
        }

        .form-control:focus {
            border-color: #ffffff;
        }

        .birthday-row {
            display: flex;
            gap: 8px;
        }

        .birthday-row select {
            flex: 1;
            background-color: #191b1d;
            border: 1px solid #393b3d;
            border-radius: 6px;
            padding: 10px 8px;
            color: #bdbebe;
            font-size: 14px;
            outline: none;
        }

        .btn-submit {
            width: 100%;
            background-color: #00b06f;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.15s;
        }

        .btn-submit:hover {
            background-color: #009960;
        }

        .btn-login-submit {
            background-color: #ffffff;
            color: #191b1d;
        }

        .btn-login-submit:hover {
            background-color: #e3e5e8;
        }

        .switch-mode {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            color: #bdbebe;
        }

        .switch-mode a {
            color: #ffffff;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .switch-mode a:hover {
            text-decoration: underline;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #808285;
            border-top: 1px solid #2b2d2f;
        }

        footer a {
            color: #bdbebe;
            text-decoration: none;
            margin: 0 10px;
        }

        footer a:hover {
            color: #ffffff;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="nav-logo">
            <img src="logo.png" alt="Decoblox">
        </div>
        <button type="button" class="btn-top-login" id="toggleHeaderBtn" onclick="toggleAuthMode()">Log In</button>
    </header>

    <main class="main-container">
        <div class="center-logo">
            <img src="logo.png" alt="Decoblox">
        </div>

        <!-- SIGN UP FORM -->
        <div class="auth-card" id="signupCard">
            <h2>SIGN UP AND START HAVING FUN!</h2>
            <form id="signupForm" onsubmit="enterSite(event, 'signupUsername')">
                <div class="form-group">
                    <label>Birthday</label>
                    <div class="birthday-row">
                        <select><option>Month</option><option>January</option><option>February</option><option>March</option><option>April</option><option>May</option><option>June</option><option>July</option><option>August</option><option>September</option><option>October</option><option>November</option><option>December</option></select>
                        <select><option>Day</option><option>1</option><option>5</option><option>10</option><option>15</option><option>20</option><option>25</option></select>
                        <select><option>Year</option><option>2006</option><option>2007</option><option>2008</option><option>2009</option><option>2010</option></select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="signupUsername">Username</label>
                    <input type="text" id="signupUsername" class="form-control" placeholder="Don't use your real name" required>
                </div>
                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" class="form-control" placeholder="At least 8 characters" required>
                </div>
                <button type="submit" class="btn-submit">Sign Up</button>
            </form>
            <div class="switch-mode">
                Already have an account? <a onclick="showLogin()">Log In</a>
            </div>
        </div>

        <!-- LOG IN FORM -->
        <div class="auth-card hidden" id="loginCard">
            <h2>LOGIN TO DECOBLOX</h2>
            <form id="loginForm" onsubmit="enterSite(event, 'loginUsername')">
                <div class="form-group">
                    <input type="text" id="loginUsername" class="form-control" placeholder="Username / Email / Phone" required>
                </div>
                <div class="form-group">
                    <input type="password" id="loginPassword" class="form-control" placeholder="Password" required>
                </div>
                <button type="submit" class="btn-submit btn-login-submit">Log In</button>
            </form>
            <div class="switch-mode">
                Don't have an account? <a onclick="showSignup()">Sign Up</a>
            </div>
        </div>
    </main>

    <footer>
        <div>
            <a href="#">About Us</a>
            <a href="#">Jobs</a>
            <a href="#">Blog</a>
            <a href="#">Parents</a>
            <a href="#">Help</a>
            <a href="#">Terms</a>
            <a href="#">Privacy</a>
        </div>
        <p style="margin-top: 10px;">©2026 Decoblox. All rights reserved.</p>
    </footer>

    <script>
        function showLogin() {
            document.getElementById("signupCard").classList.add("hidden");
            document.getElementById("loginCard").classList.remove("hidden");
            document.getElementById("toggleHeaderBtn").textContent = "Sign Up";
        }

        function showSignup() {
            document.getElementById("loginCard").classList.add("hidden");
            document.getElementById("signupCard").classList.remove("hidden");
            document.getElementById("toggleHeaderBtn").textContent = "Log In";
        }

        function toggleAuthMode() {
            const isSignupVisible = !document.getElementById("signupCard").classList.contains("hidden");
            if (isSignupVisible) {
                showLogin();
            } else {
                showSignup();
            }
        }

        function enterSite(event, inputId) {
            event.preventDefault();
            const input = document.getElementById(inputId);
            const username = (input && input.value.trim()) ? input.value.trim() : "Player";
            localStorage.setItem("decoblox_user", username);
            window.location.href = "home.html";
        }
    </script>

</body>
</html>
